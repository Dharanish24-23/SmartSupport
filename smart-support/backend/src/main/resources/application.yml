server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: smart-support-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smart_support_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:YOUR_POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  jwt:
    secret: ${JWT_SECRET:ChangeThisSuperSecretKeyForSmartSupportDemoProjectOnly123456}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  upload:
    dir: ${UPLOAD_DIR:uploads}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  admin:
    default-email: ${ADMIN_EMAIL:admin@smartsupport.com}
    default-password: ${ADMIN_PASSWORD:Admin@1234}
